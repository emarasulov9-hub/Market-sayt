<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЛЕГАЛЬНО.МАРКЕТ</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome ikonkalari uchun -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="header">
    <div class="container header-container">
      <button class="catalog-btn">
        <i class="fa-solid fa-border-all"></i> Каталог
      </button>

      <div class="logo">ЛЕГАЛЬНО.МАРКЕТ</div>

      <div class="search-bar">
        <input type="text" placeholder="Искать товары и категории">
        <button type="submit">Найти</button>
      </div>

      <div class="user-actions">
        <a href="#" class="action-item">
          <i class="fa-regular fa-heart"></i>
          <span>Избранное</span>
        </a>
        <a href="#" class="action-item">
          <i class="fa-solid fa-cart-shopping"></i>
          <span>Корзина</span>
        </a>
        <a href="#" class="action-item">
          <i class="fa-regular fa-user"></i>
          <span>Профиль</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Banner Section -->
    <section class="banner">
      <button class="nav-btn prev"><i class="fa-solid fa-chevron-left"></i></button>
      
      <div class="banner-content">
        <div class="banner-text">
          <h1>Скидки до −25% на легальное</h1>
          <p>Лучшие товары недели. Проверено юристами, заверено печатью.</p>
        </div>
        <a href="#" class="banner-link-btn">Смотреть скидки</a>
      </div>

      <button class="nav-btn next"><i class="fa-solid fa-chevron-right"></i></button>

      <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </section>

    <!-- Categories Section -->
    <section class="categories">
      <h2>Категории</h2>
      <div class="category-list">
        <div class="category-item">
          <div class="icon-box"><i class="fa-solid fa-house"></i></div>
          <span>Дом</span>
        </div>
        <div class="category-item">
          <div class="icon-box"><i class="fa-solid fa-bolt"></i></div>
          <span>Техника</span>
        </div>
        <div class="category-item">
          <div class="icon-box"><i class="fa-solid fa-utensils"></i></div>
          <span>Еда</span>
        </div>
        <div class="category-item">
          <div class="icon-box"><i class="fa-solid fa-bicycle"></i></div>
          <span>Транспорт</span>
        </div>
        <div class="category-item">
          <div class="icon-box"><i class="fa-solid fa-music"></i></div>
          <span>Хобби</span>
        </div>
        <div class="category-item">
          <div class="icon-box"><i class="fa-solid fa-seedling"></i></div>
          <span>Живность</span>
        </div>
        <div class="category-item">
          <div class="icon-box"><i class="fa-solid fa-cube"></i></div>
          <span>Странное</span>
        </div>
      </div>
    </section>

 

      </div>
    </section>
  </main>

</body>
</html>
